<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업박스 (UpBox) - 택배 자동 수송 서비스</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .header h1 {
            color: var(--primary);
            font-size: 26px;
            font-weight: 800;
        }

        .header p {
            color: var(--text-sub);
            font-size: 13px;
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-scan {
            background-color: #334155;
            color: #38bdf8;
            border: 1px solid #0284c7;
            margin-bottom: 8px;
        }

        /* 수송 목록 */
        .queue-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .queue-item {
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .queue-item .info strong {
            color: #fff;
        }

        .queue-item .info span {
            color: var(--text-sub);
            font-size: 12px;
            display: block;
        }

        .badge {
            background: #065f46;
            color: #34d399;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        /* 실시간 상태창 */
        .status-log {
            background: #000;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #38bdf8;
            height: 120px;
            overflow-y: auto;
            border: 1px solid var(--border);
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 헤더 -->
    <div class="header">
        <h1>📦 UpBox</h1>
        <p>101동 승강기 자동 연결 수송 모듈</p>
    </div>

    <!-- 입력폼 -->
    <div class="card">
        <div class="card-title">STEP 1. 사용자 및 택배 정보 입력</div>
        
        <div class="form-group">
            <label>배송지 (동/호수)</label>
            <input type="number" id="roomInput" placeholder="예: 802 (호수 입력시 층수 자동인식)">
        </div>

        <div class="form-group">
            <label>수령인 성함 (선택)</label>
            <input type="text" id="nameInput" placeholder="예: 홍길동">
        </div>

        <div class="form-group">
            <label>운송장 번호 / 바코드</label>
            <input type="text" id="barcodeInput" placeholder="운송장 번호 입력 또는 스캔">
        </div>

        <button class="btn btn-scan" onclick="scanBarcode()">📷 바코드/택배 카메라 스캔</button>
        <button class="btn" onclick="addDelivery()">➕ 택배 수송 리스트에 적재</button>
    </div>

    <!-- 수송 대기 목록 -->
    <div class="card">
        <div class="card-title">STEP 2. 엘리베이터 적재 목록</div>
        <div class="queue-list" id="queueList">
            <div style="text-align: center; color: var(--text-sub); font-size: 13px; padding: 10px;">
                등록된 택배가 없습니다.
            </div>
        </div>
    </div>

    <!-- 수송 제어 -->
    <div class="card">
        <div class="card-title">STEP 3. 택배 위로 올리기</div>
        <button class="btn" style="background-color: var(--accent); color: #000; margin-bottom: 10px;" onclick="startDelivery()">🚀 엘리베이터 수송 시작</button>
        <div class="status-log" id="systemLog">> 엘리베이터 통신 연결 완료. 대기 중...</div>
    </div>
</div>

<script>
    let deliveryQueue = [];

    function scanBarcode() {
        const randomNum = Math.floor(1000000000 + Math.random() * 9000000000);
        document.getElementById('barcodeInput').value = "UPBOX-" + randomNum;
        log("[스캔 완료] 바코드 자동 인식됨: UPBOX-" + randomNum);
    }

    function addDelivery() {
        const room = document.getElementById('roomInput').value;
        const name = document.getElementById('nameInput').value || '입주민';
        const barcode = document.getElementById('barcodeInput').value || '미인식';

        if (!room) {
            alert('동/호수를 입력해 주세요.');
            return;
        }

        const floor = Math.floor(parseInt(room) / 100) || parseInt(room);

        deliveryQueue.push({ room, floor, name, barcode });
        
        // 층수 기준 최적화 (하층 -> 상층 순서)
        deliveryQueue.sort((a, b) => a.floor - b.floor);

        updateUI();
        log(`[적재 완료] ${room}호 (${name}님) / ${floor}층 등록됨`);

        // 입력 폼 초기화
        document.getElementById('roomInput').value = '';
        document.getElementById('nameInput').value = '';
        document.getElementById('barcodeInput').value = '';
    }

    function updateUI() {
        const listEl = document.getElementById('queueList');
        if (deliveryQueue.length === 0) {
            listEl.innerHTML = '<div style="text-align: center; color: var(--text-sub); font-size: 13px; padding: 10px;">등록된 택배가 없습니다.</div>';
            return;
        }

        listEl.innerHTML = deliveryQueue.map(item => `
            <div class="queue-item">
                <div class="info">
                    <strong>${item.room}호 (${item.floor}층) - ${item.name}님</strong>
                    <span>송장: ${item.barcode}</span>
                </div>
                <span class="badge">적재 완료</span>
            </div>
        `).join('');
    }

    function log(msg) {
        const logEl = document.getElementById('systemLog');
        logEl.innerHTML += `<br>> ${msg}`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    function startDelivery() {
        if (deliveryQueue.length === 0) {
            alert('올려보낼 택배를 먼저 등록해 주세요.');
            return;
        }

        log('=================================');
        log('-> [업박스 직행 모드 발동]');
        log('-> 문열림 시간 4분 연장');

        deliveryQueue.forEach((item, index) => {
            setTimeout(() => {
                log(`[이동] ${item.floor}층 승강기 도착`);
                log(`[알림] ${item.room}호 (${item.name}님) 도착 사진 촬영 및 자동 문지 전송!`);
                
                if (index === deliveryQueue.length - 1) {
                    log('-> 모든 택배 배송 완료. 1층으로 복귀합니다.');
                    deliveryQueue = [];
                    updateUI();
                }
            }, (index + 1) * 1500);
        });
    }
</script>

</body>
</html>
